<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruzi Coin Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #ffd700; --bg: #000000; --card: #1c1c1e; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif; margin: 0; padding: 0; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; height: 100vh; display: flex; flex-direction: column; }

        /* LOADING & ERROR SCREEN */
        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
        .loader { border: 4px solid #333; border-top: 4px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #errorText { color: #ff4444; font-weight: bold; margin-top: 20px; font-size: 14px; display: none; }
        #retryBtn { margin-top: 20px; padding: 10px 20px; background: var(--gold); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: none; }

        /* GAME UI */
        .page { display: none; flex-direction: column; height: 100%; width: 100%; padding: 20px 20px 100px 20px; box-sizing: border-box; align-items: center; overflow-y: auto; }
        .page.active { display: flex; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; padding-bottom: 10px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #666; font-size: 11px; width: 20%; cursor: pointer; }
        .nav-item.active { color: var(--gold); transform: translateY(-2px); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
        #score { font-size: 48px; font-weight: 800; margin: 10px 0; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .coin-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        .coin { width: 70vw; height: 70vw; max-width: 280px; max-height: 280px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ffd700, #ffaa00); box-shadow: 0 0 60px rgba(255, 165, 0, 0.4); display: flex; align-items: center; justify-content: center; border: 8px solid #b8860b; position: relative; transition: transform 0.08s; }
        .coin:active { transform: scale(0.95); }
        .coin-logo { font-size: 50px; font-weight: 900; color: #7a5c00; font-family: serif; }
        .energy-box { background: rgba(255,255,255,0.1); padding: 8px 20px; border-radius: 30px; margin-bottom: 20px; font-weight: bold; }
        .float-text { position: absolute; color: white; font-weight: bold; font-size: 30px; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 999; }
        @keyframes floatUp { to { transform: translateY(-100px); opacity: 0; } }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loader" id="loaderSpinner"></div>
        <div style="color:var(--gold); font-weight:bold">Fruzi Coin</div>
        <div style="font-size:12px; color:#666; margin-top:5px" id="loadingStatus">Connecting to Server...</div>
        <div id="errorText"></div>
        <button id="retryBtn" onclick="location.reload()">Retry Connection</button>
    </div>

    <div id="gameContainer" style="display:none; height:100%">
        <div class="page active" id="homePage">
            <div style="font-size:12px; color:#888; margin-top:20px;">YOUR BALANCE</div>
            <div id="score">0</div>
            <div class="coin-wrapper"><div class="coin" id="coinBtn"><div class="coin-logo">FRUZI</div></div></div>
            <div class="energy-box">⚡ <span id="energyVal">1000</span> / <span id="energyMaxVal">1000</span></div>
        </div>
        <nav class="bottom-nav">
            <div class="nav-item active"><span class="nav-icon">🏠</span>Home</div>
            <div class="nav-item"><span class="nav-icon">🚀</span>Boost</div>
            <div class="nav-item"><span class="nav-icon">📋</span>Tasks</div>
            <div class="nav-item"><span class="nav-icon">👥</span>Friends</div>
            <div class="nav-item"><span class="nav-icon">🏆</span>Top</div>
        </nav>
    </div>

    <script>
        // --- QAT'IY ONLAYN REJIM ---
        const SUPABASE_URL = 'https://dwotktqghawusjbmvvak.supabase.co';
        const SUPABASE_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3b3RrdHFnaGF3dXNqYm12dmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MDA5NjUsImV4cCI6MjA4NDM3Njk2NX0.AgSlVmVUksfSuQCHvSXyHlEzEnZ8N5aZlE1fIk0YEH4';

        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe.user || { id: 999999, first_name: "Debug User" };

        let sb, state = { balance: 0, energy: 1000, multitap: 1 };

        function showError(msg) {
            document.getElementById('loaderSpinner').style.display = 'none';
            document.getElementById('loadingStatus').innerText = "Connection Failed!";
            document.getElementById('errorText').style.display = 'block';
            document.getElementById('errorText').innerText = "ERROR: " + msg;
            document.getElementById('retryBtn').style.display = 'inline-block';
        }

        async function initGame() {
            try {
                // 1. Serverga ulanish
                sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

                // 2. Ulanishni tekshirish (Eng oddiy so'rov)
                let { data, error: healthErr } = await sb.from('users').select('count').limit(1);
                if (healthErr) throw healthErr; // Agar server javob bermasa, XATO otamiz

                console.log("Serverga ulandi!");
                document.getElementById('loadingStatus').innerText = "Loading profile...";

                // 3. Userni yuklash
                let { data: u, error: userErr } = await sb.from('users').select('*').eq('id', user.id).single();
                
                if(userErr && userErr.code === 'PGRST116') {
                    // Yangi user yaratish
                    await sb.from('users').insert([{ id: user.id, first_name: user.first_name }]);
                    state.balance = 0;
                } else if (u) {
                    state.balance = u.balance;
                    state.energy = u.energy;
                    state.multitap = u.multitap_level;
                } else if (userErr) {
                    throw userErr;
                }

                // 4. Muvaffaqiyatli! O'yinni ochamiz
                updateUI();
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('gameContainer').style.display = 'block';
                setInterval(save, 3000);

            } catch (e) {
                console.error("CRITICAL ERROR:", e);
                // Xatoni ekranga chiqaramiz
                showError(e.message || JSON.stringify(e));
            }
        }

        async function save() { if(sb) await sb.from('users').update({ balance: state.balance, energy: state.energy }).eq('id', user.id); }
        function updateUI() { document.getElementById('score').innerText = state.balance.toLocaleString(); document.getElementById('energyVal').innerText = Math.floor(state.energy); }

        document.getElementById('coinBtn').addEventListener('click', (e) => {
            if(state.energy >= state.multitap) {
                state.balance += state.multitap; state.energy -= state.multitap;
                updateUI(); tg.HapticFeedback.impactOccurred('light');
            }
        });

        // Boshlash
        if (!navigator.onLine) { showError("No Internet Connection"); } else { initGame(); }
    </script>
</body>
</html>
