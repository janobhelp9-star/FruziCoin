    <style>
        /* --- DIZAYN (Responsive & Professional) --- */
        :root {
            --gold: #ffd700;
            --bg: #000000;
            --card: #1c1c1e;
            --text: #ffffff;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0; padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            height: 100vh;
            display: flex; flex-direction: column;
        }

        /* Loading ekrani */
        #loadingScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: bold; color: var(--gold);
        }

        /* Sahifalar */
        .page {
            display: none; flex-direction: column;
            height: 100%; width: 100%;
            padding: 20px 20px 100px 20px;
            box-sizing: border-box; align-items: center;
            overflow-y: auto;
        }
        .page.active { display: flex; }

        /* Menu */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 75px;
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255,255,255,0.1);
            z-index: 1000; padding-bottom: 10px;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: #666; font-size: 11px; width: 20%; cursor: pointer;
        }
        .nav-item.active { color: var(--gold); transform: translateY(-2px); }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }

        /* O'yin elementlari */
        #score { font-size: 48px; font-weight: 800; margin: 10px 0; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        
        .coin-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
        .coin {
            width: 70vw; height: 70vw; max-width: 280px; max-height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ffaa00);
            box-shadow: 0 0 60px rgba(255, 165, 0, 0.4), inset -10px -10px 30px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center;
            border: 8px solid #b8860b;
            position: relative; transition: transform 0.08s;
        }
        .coin:active { transform: scale(0.95); }
        .coin-logo { font-size: 50px; font-weight: 900; color: #7a5c00; font-family: serif; }

        .energy-box {
            background: rgba(255,255,255,0.1); padding: 8px 20px;
            border-radius: 30px; margin-bottom: 20px; font-weight: bold;
        }

        /* Ro'yxatlar (Boost, Top) */
        .list-item {
            background: var(--card); width: 100%; padding: 15px; margin-bottom: 10px;
            border-radius: 15px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #333;
        }
        .item-left { display: flex; gap: 15px; align-items: center; }
        .icon-box { width: 40px; height: 40px; background: #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .btn-action {
            background: var(--gold); border: none; padding: 8px 15px;
            border-radius: 10px; font-weight: bold; cursor: pointer; color: black;
        }
        .float-text {
            position: absolute; color: white; font-weight: bold; font-size: 30px;
            pointer-events: none; animation: floatUp 0.8s forwards; z-index: 999;
        }
        @keyframes floatUp { to { transform: translateY(-100px); opacity: 0; } }
    </style>
</head>
