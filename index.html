<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruzi Coin</title>
    <style>
        body {
            background-color: #000;
            background-image: radial-gradient(circle at center, #2e1c00 0%, #000 80%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .score-container {
            margin-bottom: 40px;
            text-align: center;
            z-index: 10;
        }

        .score-text {
            font-size: 14px;
            color: #8b8b8b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        #score {
            font-size: 64px;
            font-weight: 800;
            font-family: sans-serif;
            text-shadow: 0 0 20px rgba(255, 180, 0, 0.5);
        }

        /* --- YANGI OLTIN TANGA DIZAYNI (Rasm ishlatilmaydi) --- */
        .coin-container {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 20;
        }

        .coin {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            /* Oltin rang gradienti */
            background: radial-gradient(circle at 30% 30%, #ffd700, #ffb300, #b8860b);
            /* Gologramma effekti va soya */
            box-shadow: 
                inset 0 0 20px rgba(255, 255, 255, 0.5),
                inset -10px -10px 20px rgba(0, 0, 0, 0.2),
                0 0 50px rgba(255, 165, 0, 0.4),
                0 20px 40px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            border: 8px solid #d4af37;
            transition: transform 0.1s;
        }

        /* Tangani bosganda kichrayishi */
        .coin:active {
            transform: scale(0.94);
        }

        /* Tanga o'rtasidagi belgi (Logo o'rniga F harfi yoki $) */
        .coin-logo {
            font-size: 130px;
            font-weight: 900;
            color: #946c00;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.3);
            font-family: serif; /* Chiroyli harf */
        }

        /* --- Animatsiyalar --- */
        .float-text {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 36px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 30;
            text-shadow: 0 0 5px orange;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }

        /* --- Pastki menyu --- */
        .bottom-bar {
            position: fixed;
            bottom: 20px;
            width: 90%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .energy-box {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .energy-text {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-bg {
            width: 100%;
            height: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff8c00, #ffd700);
            width: 100%;
            transition: width 0.3s;
        }

    </style>
</head>
<body>

    <div class="score-container">
        <div class="score-text">Fruzi Balance</div>
        <div id="score">0</div>
    </div>

    <div class="coin-container">
        <div class="coin" id="coinBtn">
            <div class="coin-logo">F</div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="energy-box">
            <div class="energy-text">
                ⚡ <span id="energyVal">1000</span> / 1000
            </div>
            <div class="progress-bg">
                <div class="progress-fill" id="energyBar"></div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Telegramni ishga tushiramiz
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.enableClosingConfirmation(); // Yopishdan oldin so'rash

        // O'zgaruvchilar
        let score = localStorage.getItem('fruzi_score_v1') ? parseInt(localStorage.getItem('fruzi_score_v1')) : 0;
        let energy = 1000;
        
        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energyVal');
        const energyBar = document.getElementById('energyBar');
        const coinBtn = document.getElementById('coinBtn');

        // Ekranga chiqarish
        scoreEl.innerText = score.toLocaleString();

        // Bosish funksiyasi
        function handleTap(x, y) {
            if (energy > 0) {
                // Ball +1
                score++;
                energy--;
                
                // Saqlash
                localStorage.setItem('fruzi_score_v1', score);
                
                // Ekranni yangilash
                scoreEl.innerText = score.toLocaleString();
                updateEnergy();

                // Vibratsiya
                tg.HapticFeedback.impactOccurred('medium');

                // +1 yozuvi chiqishi
                showFloat(x, y);
            }
        }

        // Click va Touch hodisalari
        coinBtn.addEventListener('click', (e) => handleTap(e.clientX, e.clientY));
        
        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Ekranni qotirish
            for (let i = 0; i < e.touches.length; i++) {
                handleTap(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, {passive: false});

        function updateEnergy() {
            energyEl.innerText = energy;
            energyBar.style.width = (energy / 1000 * 100) + "%";
        }

        function showFloat(x, y) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = '+1';
            el.style.left = (x - 10) + 'px';
            el.style.top = (y - 50) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // Energiya tiklanishi
        setInterval(() => {
            if (energy < 1000) {
                energy += 2;
                if(energy > 1000) energy = 1000;
                updateEnergy();
            }
        }, 1000);

    </script>
</body>
</html>
