<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruzi Coin Final</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- DIZAYN (Pixel Perfect) --- */
        :root { --gold: #ffd700; --bg: #000000; --card-bg: rgba(255, 255, 255, 0.08); --text: #ffffff; }
        body { 
            background: black; 
            background-image: radial-gradient(circle at 50% 30%, #1f1f1f 0%, #000000 70%);
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; 
            height: 100vh; display: flex; flex-direction: column; 
        }

        /* LOADING SCREEN */
        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loader { border: 3px solid #333; border-top: 3px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* HEADER & SCORE */
        .header { text-align: center; margin-top: 20px; padding-bottom: 10px; }
        .league-badge { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: #888; font-weight: 600; }
        #score { font-size: 52px; font-weight: 800; margin-top: 5px; text-shadow: 0 0 25px rgba(255,215,0,0.15); }

        /* COIN (TANGA) */
        .coin-wrapper { flex-grow: 1; display: flex; align-items: center; justify-content: center; width: 100%; position: relative; }
        .coin {
            width: 72vw; height: 72vw; max-width: 280px; max-height: 280px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            position: relative; transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer;
            box-shadow: 0 0 60px rgba(255,255,255,0.05); 
            border: 8px solid rgba(255,255,255,0.05);
        }
        .coin:active { transform: scale(0.95); }
        .coin-logo { font-size: 48px; font-weight: 900; font-family: serif; user-select: none; pointer-events: none; }

        /* LEAGUE STYLES */
        .bronze { background: radial-gradient(circle at 30% 30%, #cd7f32, #8b4513); border-color: rgba(205,127,50,0.3); }
        .silver { background: radial-gradient(circle at 30% 30%, #e0e0e0, #7f8c8d); border-color: rgba(255,255,255,0.3); }
        .gold { background: radial-gradient(circle at 30% 30%, #ffd700, #ffaa00); border-color: rgba(255,215,0,0.3); box-shadow: 0 0 50px rgba(255,215,0,0.2); }
        .diamond { background: radial-gradient(circle at 30% 30%, #00ffff, #0088ff); border-color: rgba(0,255,255,0.3); box-shadow: 0 0 50px rgba(0,255,255,0.2); }

        /* LIST ITEMS (Tasklar va Do'stlar uchun) */
        .list-container { width: 100%; padding: 0 5px; box-sizing: border-box; }
        .list-item { 
            background: var(--card-bg); backdrop-filter: blur(10px);
            padding: 0 16px; margin-bottom: 12px; border-radius: 16px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid rgba(255,255,255,0.05); height: 70px; box-sizing: border-box;
            transition: transform 0.1s;
        }
        .list-item:active { transform: scale(0.98); background: rgba(255,255,255,0.12); }
        .list-item.special { border: 1px solid rgba(255, 215, 0, 0.3); background: rgba(255, 215, 0, 0.05); }

        .item-left { display: flex; align-items: center; gap: 14px; flex-grow: 1; overflow: hidden; }
        .item-icon-box { width: 40px; height: 40px; background: rgba(0,0,0,0.3); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .task-img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
        .item-info { display: flex; flex-direction: column; justify-content: center; }
        .item-title { font-weight: 700; font-size: 15px; color: #fff; margin-bottom: 3px; white-space: nowrap; }
        .item-desc { font-size: 11px; color: #888; }

        /* TUGMALAR */
        .btn-action { 
            background: var(--gold); border: none; min-width: 90px; height: 38px; 
            border-radius: 10px; font-weight: 700; cursor: pointer; color: #000; font-size: 13px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.2); flex-shrink: 0; margin-left: 10px;
        }
        .btn-action:disabled { background: #2a2a2a; color: #888; border: 1px solid #333; box-shadow: none; cursor: not-allowed; }
        .btn-action.claim-ready { background: #2ecc71; color: white; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* NAVIGATSIYA */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 80px; background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000; padding-bottom: 15px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #555; font-size: 10px; width: 20%; transition: 0.2s; font-weight: 500; }
        .nav-item.active { color: var(--gold); transform: translateY(-3px); font-weight: 700; }
        .nav-icon { font-size: 24px; margin-bottom: 5px; }

        .page { display: none; flex-direction: column; height: 100%; width: 100%; padding: 20px 20px 100px 20px; box-sizing: border-box; align-items: center; overflow-y: auto; }
        .page.active { display: flex; }
        .float-text { position: absolute; color: white; font-weight: 800; font-size: 32px; pointer-events: none; animation: floatUp 0.8s forwards; z-index: 999; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        @keyframes floatUp { to { transform: translateY(-100px) scale(1.1); opacity: 0; } }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loader"></div>
        <div style="color:#666; font-size:12px">Loading Fruzi Coin...</div>
        <div id="errorText" style="color:red; display:none; margin-top:10px; font-size:12px"></div>
    </div>

    <div id="gameContainer" style="display:none; height:100%">
        
        <div class="page active" id="homePage">
            <div class="header">
                <div class="league-badge" id="leagueName">Bronze</div>
                <div id="score">0</div>
            </div>
            
            <div class="coin-wrapper">
                <div class="coin bronze" id="coinBtn">
                    <div class="coin-logo">FRUZI</div>
                </div>
            </div>

            <div style="background:rgba(255,255,255,0.08); padding:8px 20px; border-radius:30px; margin-bottom:20px; display:flex; align-items:center; gap:8px;">
                <span style="font-size:18px">⚡</span> 
                <span id="energyVal" style="font-weight:700">1000</span> <span style="color:#666">/</span> <span id="energyMaxVal">1000</span>
            </div>
        </div>

        <div class="page" id="boostPage">
            <h2 style="color:var(--gold); margin-bottom:20px">Boosters</h2>
            <div class="list-container">
                <div class="list-item special">
                    <div class="item-left">
                        <div class="item-icon-box" style="background:transparent; font-size:28px">🤖</div>
                        <div class="item-info">
                            <span class="item-title">Auto Bot</span>
                            <span class="item-desc">Mines while you sleep</span>
                        </div>
                    </div>
                    <button class="btn-action" id="buyBotBtn">1M</button>
                </div>
                <div class="list-item">
                    <div class="item-left">
                        <div class="item-icon-box">👆</div>
                        <div class="item-info">
                            <span class="item-title">Multitap</span>
                            <span class="item-desc" id="multiInfo">Lvl 1</span>
                        </div>
                    </div>
                    <button class="btn-action" id="buyMultiBtn">Up</button>
                </div>
                <div class="list-item">
                    <div class="item-left">
                        <div class="item-icon-box">🔋</div>
                        <div class="item-info">
                            <span class="item-title">Energy Limit</span>
                            <span class="item-desc" id="energyInfo">Lvl 1</span>
                        </div>
                    </div>
                    <button class="btn-action" id="buyEnergyBtn">Up</button>
                </div>
            </div>
        </div>

        <div class="page" id="tasksPage">
            <h2 style="color:var(--gold); margin-bottom:5px">Tasks</h2>
            <p style="color:#666; font-size:12px; margin-bottom:20px">Click START & Wait 15s to claim</p>
            <div id="tasksList" class="list-container"></div>
        </div>

        <div class="page" id="friendsPage">
            <h2 style="color:var(--gold); margin-bottom:20px">Friends</h2>
            <div style="background: linear-gradient(135deg, #1e1e24 0%, #151515 100%); padding:25px; border-radius:20px; text-align:center; width:100%; box-sizing:border-box; border:1px solid rgba(255,255,255,0.05); margin-bottom:20px">
                <div style="font-size:48px; margin-bottom:10px">🎁</div>
                <h3 style="margin:0; color:#fff">Invite & Earn</h3>
                
                <p style="color:#888; font-size:13px; margin:5px 0 15px 0" id="refRewardText">Get +50,000 coins</p>
                
                <button class="btn-action" style="width:100%; margin:0" id="inviteBtn">Copy Link 🔗</button>
            </div>
            
            <div class="list-container">
                <div style="font-size:12px; color:#666; margin-bottom:10px; padding-left:5px">YOUR FRIENDS:</div>
                <div id="friendsList"></div>
            </div>
        </div>

        <div class="page" id="topPage">
            <h2 style="color:var(--gold); margin-bottom:20px">Leaderboard</h2>
            <div id="leaderboardList" class="list-container">
                <div style="text-align:center; color:#666">Loading...</div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="openPage('homePage', this)"><span class="nav-icon">🏠</span>Home</div>
            <div class="nav-item" onclick="openPage('boostPage', this)"><span class="nav-icon">🚀</span>Boost</div>
            <div class="nav-item" onclick="openPage('tasksPage', this)"><span class="nav-icon">📋</span>Tasks</div>
            <div class="nav-item" onclick="openPage('friendsPage', this)"><span class="nav-icon">👥</span>Friends</div>
            <div class="nav-item" onclick="openPage('topPage', this)"><span class="nav-icon">🏆</span>Top</div>
        </nav>
    </div>

    <script>
        // ==========================================
        // ⚙️ SOZLAMALAR (CONFIG)
        // ==========================================
        const CONFIG = {
            botUserName: 'Fruzicoinbot', // <-- BOT USERNAME
            
            prices: {
                bot: 100000,      
                multitapBase:500 
                energyBase: 500,   
                taskReward: 50000, 
                referral: 50000    // 50K REFERAL
            },

            // LOGOLAR (TIKTOK YANGILANDI - QORA LOGO)
            tasks: [
                { id: 'tg', name: 'Telegram', link: 'https://t.me/FruziCoin', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Telegram_logo.svg/1024px-Telegram_logo.svg.png' },
                { id: 'yt', name: 'YouTube', link: 'https://youtube.com/@FruziCoin', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/0/09/YouTube_full-color_icon_%282017%29.svg/1024px-YouTube_full-color_icon_%282017%29.svg.png' },
                
                // YANGI ISHONCHLI TIKTOK RASM
                { id: 'tt', name: 'TikTok', link: 'https://tiktok.com/@FruziCoin', img: 'https://cdn-icons-png.flaticon.com/512/3046/3046126.png' },
                
                { id: 'ig', name: 'Instagram', link: 'https://instagram.com/FruziCoin', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Instagram_logo_2016.svg/1024px-Instagram_logo_2016.svg.png' },
                { id: 'tw', name: 'Twitter (X)', link: 'https://twitter.com/FruziCoin', img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/ce/X_logo_2023.svg/600px-X_logo_2023.svg.png' }
            ]
        };

        const SUPABASE_URL = 'https://dwotktqghawusjbmvvak.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3b3RrdHFnaGF3dXNqYm12dmFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MDA5NjUsImV4cCI6MjA4NDM3Njk2NX0.AgSlVmVUksfSuQCHvSXyHlEzEnZ8N5aZlE1fIk0YEH4';

        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe.user || { id: 777, first_name: "Test User" };
        const startParam = tg.initDataUnsafe.start_param;

        let state = { balance: 0, energy: 1000, energy_max: 1000, multitap: 1, energy_limit: 1, has_bot: false, completedTasks: {}, lastDaily: null };

        async function init() {
            try {
                // Referal narxini ko'rsatish (English)
                document.getElementById('refRewardText').innerText = `Get +${CONFIG.prices.referral.toLocaleString()} coins per friend`;

                let { data: u, error } = await sb.from('users').select('*').eq('id', user.id).single();
                
                // YANGI USER
                if (error && error.code === 'PGRST116') {
                    let refId = (startParam && startParam.startsWith('ref_')) ? parseInt(startParam.split('_')[1]) : null;
                    let startBal = 0;
                    
                    // 1. Yangi userni bazaga qo'shish
                    await sb.from('users').insert([{ 
                        id: user.id, 
                        username: user.username, 
                        first_name: user.first_name, 
                        balance: startBal, 
                        invited_by: refId 
                    }]);
                    
                    // 2. Taklif qilgan odamga pul berish
                    if(refId && refId !== user.id) {
                        await sb.rpc('increment_balance', { user_id: refId, amount: CONFIG.prices.referral });
                    }
                    
                    state.balance = startBal;
                } else if (u) {
                    // ESKI USER
                    state = { balance: u.balance, energy: u.energy, energy_max: u.energy_max, multitap: u.multitap_level, energy_limit: u.energy_limit_level, has_bot: u.has_auto_bot, completedTasks: u.completed_tasks || {}, lastDaily: u.last_daily_claim };
                    let diff = Math.floor((Date.now() - new Date(u.last_active).getTime())/1000);
                    state.energy = Math.min(state.energy_max, state.energy + diff);
                    // Auto bot alert (English)
                    if(state.has_bot && diff > 60) { state.balance += diff; alert(`🤖 Auto Bot mined: +${diff.toLocaleString()} coins!`); }
                }
                updateUI(); renderTasks(); checkLeague(); 
                document.getElementById('loadingScreen').style.display = 'none'; document.getElementById('gameContainer').style.display = 'block';
                setInterval(save, 2000);
            } catch (e) { 
                // Error message (English)
                document.getElementById('errorText').innerText = "Connection Error: " + e.message; 
                document.getElementById('errorText').style.display = 'block'; 
            }
        }

        async function save() { await sb.from('users').upsert({ id: user.id, balance: state.balance, energy: state.energy, energy_max: state.energy_max, multitap_level: state.multitap, energy_limit_level: state.energy_limit, has_auto_bot: state.has_bot, completed_tasks: state.completedTasks, last_active: new Date().toISOString() }); }

        function checkLeague() {
            let el = document.getElementById('coinBtn'), name = document.getElementById('leagueName'); el.classList.remove('bronze', 'silver', 'gold', 'diamond');
            if (state.balance < 5000) { el.classList.add('bronze'); name.innerText = "Bronze"; name.style.color = "#cd7f32"; }
            else if (state.balance < 50000) { el.classList.add('silver'); name.innerText = "Silver"; name.style.color = "#e0e0e0"; }
            else if (state.balance < 1000000) { el.classList.add('gold'); name.innerText = "Gold"; name.style.color = "#ffd700"; }
            else { el.classList.add('diamond'); name.innerText = "Diamond"; name.style.color = "#00ffff"; }
        }

        // --- DO'STLARNI KO'RSATISH (Leaderboard style - English) ---
        async function loadFriends() { 
            let list = document.getElementById('friendsList'); 
            list.innerHTML = '<div style="text-align:center; color:#666">Loading...</div>'; 
            
            let { data } = await sb.from('users').select('first_name, balance').eq('invited_by', user.id); 
            
            list.innerHTML = ''; 
            if(data && data.length > 0) {
                data.forEach(f => {
                    list.innerHTML += `
                    <div class="list-item" style="height:50px">
                        <div class="item-left">
                            <span style="font-size:20px">👤</span>
                            <span class="item-title">${f.first_name}</span>
                        </div>
                        <span style="color:var(--gold); font-weight:bold">+${CONFIG.prices.referral/1000}k</span>
                    </div>`;
                });
            } else { 
                list.innerHTML = '<div style="text-align:center;padding:20px;color:#666">No friends yet</div>'; 
            }
        }

        // --- TOP REYTING (Leaderboard - TUZATILDI - English) ---
        async function loadTop() { 
            let list = document.getElementById('leaderboardList'); 
            list.innerHTML = '<div style="text-align:center; color:#666">Loading...</div>'; 
            
            // Bazadan eng ko'p 10 ta odamni olish
            let { data } = await sb.from('users').select('first_name, balance').order('balance', {ascending:false}).limit(10); 
            
            list.innerHTML = ''; 
            if(data && data.length > 0) {
                data.forEach((p, i) => {
                    list.innerHTML += `
                    <div class="list-item" style="height:50px">
                        <div class="item-left">
                            <b style="color:#666; width:30px">#${i+1}</b>
                            <span class="item-title">${p.first_name}</span>
                        </div>
                        <span style="color:var(--gold); font-weight:bold">${p.balance.toLocaleString()}</span>
                    </div>`;
                });
            } else {
                list.innerHTML = '<div style="text-align:center; color:#666">No data yet</div>';
            }
        }

        // --- TASKS (15s TIMER - English) ---
        function renderTasks() {
            const list = document.getElementById('tasksList'); list.innerHTML = '';
            CONFIG.tasks.forEach(t => {
                let isDone = state.completedTasks[t.id];
                let btnHtml = isDone 
                    ? `<button class="btn-action" disabled style="width:100px; color:#00ff00">Done ✅</button>` 
                    : `<button class="btn-action" id="btn-${t.id}" onclick="startTask('${t.id}')">Start</button>`;
                
                list.innerHTML += `
                <div class="list-item">
                    <div class="item-left">
                        <img src="${t.img}" class="task-img">
                        <div class="item-info">
                            <span class="item-title">${t.name}</span>
                            <span class="item-desc">+${(CONFIG.prices.taskReward/1000).toFixed(0)}k coin</span>
                        </div>
                    </div>
                    ${btnHtml}
                </div>`;
            });
        }

        window.startTask = function(id) {
            let task = CONFIG.tasks.find(t=>t.id===id);
            let btn = document.getElementById(`btn-${id}`);
            window.open(task.link, '_blank');
            btn.disabled = true;
            let timeLeft = 15;
            btn.innerText = `Wait ${timeLeft}s`;
            let timer = setInterval(() => {
                timeLeft--;
                btn.innerText = `Wait ${timeLeft}s`;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    btn.innerText = "Claim";
                    btn.classList.add("claim-ready");
                    btn.disabled = false;
                    btn.onclick = function() { claimTask(id, btn); };
                }
            }, 1000);
        }

        function claimTask(id, btn) {
            if(state.completedTasks[id]) return;
            state.balance += CONFIG.prices.taskReward;
            state.completedTasks[id] = true;
            tg.HapticFeedback.notificationOccurred('success');
            updateUI(); save(); renderTasks();
        }

        function updateUI() {
            document.getElementById('score').innerText = state.balance.toLocaleString(); 
            document.getElementById('energyVal').innerText = Math.floor(state.energy); 
            document.getElementById('energyMaxVal').innerText = state.energy_max;
            
            document.getElementById('buyMultiBtn').innerText = `Up (${(state.multitap * CONFIG.prices.multitapBase).toLocaleString()})`; 
            document.getElementById('multiInfo').innerText = `Lvl ${state.multitap}`;
            
            document.getElementById('buyEnergyBtn').innerText = `Up (${(state.energy_limit * CONFIG.prices.energyBase).toLocaleString()})`; 
            document.getElementById('energyInfo').innerText = `Lvl ${state.energy_limit}`;
            
            let botBtn = document.getElementById('buyBotBtn'); 
            if(state.has_bot) { botBtn.innerText = "Active"; botBtn.disabled = true; botBtn.style.color = "#00ff00"; } 
            else { botBtn.innerText = (CONFIG.prices.bot / 1000000) + "M"; }
            checkLeague();
        }

        const coinBtn = document.getElementById('coinBtn');
        coinBtn.addEventListener('touchstart', (e) => { e.preventDefault(); Array.from(e.changedTouches).forEach(t => tap(t.clientX, t.clientY)); }, {passive:false});
        coinBtn.addEventListener('click', (e) => tap(e.clientX, e.clientY));
        function tap(x, y) { if(state.energy >= 1) { state.balance += state.multitap; state.energy -= 1; updateUI(); showFloat(x, y, '+' + state.multitap); tg.HapticFeedback.impactOccurred('light'); } }
        function showFloat(x, y, t) { let el = document.createElement('div'); el.className='float-text'; el.innerText=t; el.style.left=(x-20)+'px'; el.style.top=(y-50)+'px'; document.body.appendChild(el); setTimeout(()=>el.remove(), 800); }

        window.openPage = function(id, btn) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); btn.classList.add('active'); if(id === 'topPage') loadTop(); if(id === 'friendsPage') loadFriends(); }
        
        // Invite button alert (English)
        document.getElementById('inviteBtn').addEventListener('click', () => { navigator.clipboard.writeText(`https://t.me/${CONFIG.botUserName}?start=ref_${user.id}`); alert("Link copied! Share with friends."); });
        
        document.getElementById('buyBotBtn').addEventListener('click', () => { if(state.balance >= CONFIG.prices.bot && !state.has_bot) { state.balance -= CONFIG.prices.bot; state.has_bot = true; updateUI(); save(); } });
        document.getElementById('buyMultiBtn').addEventListener('click', () => { let p = state.multitap * CONFIG.prices.multitapBase; if(state.balance >= p) { state.balance -= p; state.multitap++; updateUI(); save(); } });
        document.getElementById('buyEnergyBtn').addEventListener('click', () => { let p = state.energy_limit * CONFIG.prices.energyBase; if(state.balance >= p) { state.balance -= p; state.energy_limit++; state.energy_max += 500; updateUI(); save(); } });
        
        setInterval(() => { if(state.energy < state.energy_max) { state.energy++; updateUI(); } }, 1000); init();
    </script>
</body>
    </html>
