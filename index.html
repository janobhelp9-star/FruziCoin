<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruzi Coin Fixed</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ASOSIY EKRAN --- */
        .score-big {
            font-size: 60px;
            font-weight: 800;
            margin-top: 50px;
            margin-bottom: 20px;
            z-index: 5;
        }

        .coin-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10; /* Tanga bosilishi uchun */
        }

        .coin {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #e6ac00);
            box-shadow: 0 0 50px rgba(255, 165, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 8px solid #d4af37;
            position: relative;
        }
        
        .coin:active { transform: scale(0.95); }
        .coin-text { font-size: 100px; font-weight: bold; color: #b8860b; }

        /* --- MENU TUGMASI (TUZATILDI) --- */
        .bottom-controls {
            position: fixed; /* Ekranda qotirib qo'yish */
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 9999; /* Hamma narsadan tepada turishi SHART */
            pointer-events: auto; /* Bosishga ruxsat */
        }

        .energy-box {
            background: rgba(255,255,255,0.2);
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .menu-btn {
            background: #007bff;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(0,123,255,0.6);
            cursor: pointer;
        }
        
        .menu-btn:active { transform: scale(0.9); }

        /* +1 animatsiyasi */
        .float-text {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 30px;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
            z-index: 100;
        }
        @keyframes floatUp { to { transform: translateY(-100px); opacity: 0; } }

        /* --- MENU OYNASI --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 10000;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-content {
            background: #1a1a1a;
            width: 100%;
            height: 70vh;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            overflow-y: auto;
            text-align: center;
        }

        .close-btn {
            background: red; color: white; border: none;
            padding: 5px 15px; border-radius: 10px;
            float: right; font-weight: bold; margin-bottom: 10px;
        }

        .boost-item {
            background: #333; margin: 10px 0; padding: 15px;
            border-radius: 10px; display: flex;
            justify-content: space-between; align-items: center;
        }
        
        .boost-btn {
            background: #ffd700; border: none; padding: 8px 20px;
            border-radius: 5px; font-weight: bold; color: black;
        }

    </style>
</head>
<body>

    <div class="score-big" id="score">0</div>
    
    <div class="coin-wrapper">
        <div class="coin" id="coinBtn">
            <div class="coin-text">F</div>
        </div>
    </div>

    <div class="bottom-controls">
        <div class="energy-box">⚡ <span id="energyVal">1000</span></div>
        <button class="menu-btn" id="openMenuBtn">🚀 Menu</button>
    </div>

    <div class="modal-overlay" id="menuModal">
        <div class="modal-content">
            <button class="close-btn" id="closeMenuBtn">Yopish X</button>
            <h2>🚀 Kuchaytirgichlar</h2>
            
            <div class="boost-item">
                <div style="text-align:left">
                    <div>👆 <b>Multitap</b></div>
                    <div style="font-size:12px; color:#aaa" id="multiCost">100 coins</div>
                </div>
                <button class="boost-btn" id="buyMultiBtn">Olish</button>
            </div>

            <div class="boost-item">
                <div style="text-align:left">
                    <div>🔋 <b>Energy Limit</b></div>
                    <div style="font-size:12px; color:#aaa" id="energyCost">100 coins</div>
                </div>
                <button class="boost-btn" id="buyEnergyBtn">Olish</button>
            </div>
            
            <br>
            <h3>Do'stlarni taklif qilish</h3>
            <div style="background:#004085; padding:15px; border-radius:10px;">
                <p>Har bir do'st uchun +500 ball!</p>
                <button class="boost-btn" onclick="alert('Havola nusxalandi!')" style="background:white; color:blue">Linkdan nusxa olish</button>
            </div>
        </div>
    </div>

    <script>
        // XATOLIKLARNI OLDINI OLISH
        try {
            const scoreEl = document.getElementById('score');
            const energyEl = document.getElementById('energyVal');
            const coinBtn = document.getElementById('coinBtn');
            const menuModal = document.getElementById('menuModal');
            
            // Xotirani o'qish
            let score = Number(localStorage.getItem('f_score')) || 0;
            let multitap = Number(localStorage.getItem('f_multitap')) || 1;
            let energy = 1000;
            let multiCost = multitap * 100;

            // Ekranni yangilash
            function update() {
                scoreEl.innerText = score;
                energyEl.innerText = energy;
                document.getElementById('multiCost').innerText = multiCost + " coins";
            }
            update();

            // TANGA BOSISH
            coinBtn.addEventListener('click', (e) => {
                if(energy >= multitap) {
                    score += multitap;
                    energy -= multitap;
                    localStorage.setItem('f_score', score);
                    update();
                    
                    // +1 animatsiyasi
                    let float = document.createElement('div');
                    float.className = 'float-text';
                    float.innerText = '+' + multitap;
                    float.style.left = e.clientX + 'px';
                    float.style.top = (e.clientY - 50) + 'px';
                    document.body.appendChild(float);
                    setTimeout(() => float.remove(), 800);
                }
            });

            // MENU OCHISH VA YOPISH (Eng oddiy usulda)
            document.getElementById('openMenuBtn').addEventListener('click', () => {
                menuModal.style.display = 'flex';
            });
            
            document.getElementById('closeMenuBtn').addEventListener('click', () => {
                menuModal.style.display = 'none';
            });

            // SOTIB OLISH
            document.getElementById('buyMultiBtn').addEventListener('click', () => {
                if(score >= multiCost) {
                    score -= multiCost;
                    multitap++;
                    multiCost = multitap * 100;
                    localStorage.setItem('f_multitap', multitap);
                    localStorage.setItem('f_score', score);
                    update();
                    alert("Tabriklaymiz! Kuchaydi ✅");
                } else {
                    alert("Mablag' yetarli emas ❌");
                }
            });
            
            // ENERGIYA TIKLANISHI
            setInterval(() => {
                if(energy < 1000) {
                    energy++;
                    energyEl.innerText = energy;
                }
            }, 1000);

        } catch (error) {
            console.log("Xatolik:", error);
        }
    </script>
</body>
</html>
