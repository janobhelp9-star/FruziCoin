<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruzi Coin</title>
    <style>
        body {
            background-color: #000;
            background-image: radial-gradient(circle at center, #3d2500 0%, #000 70%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent; /* Bosganda ko'k ramka chiqmasligi uchun */
        }

        /* Hisob (Score) */
        .score-container {
            margin-top: 20px;
            text-align: center;
            z-index: 10;
        }

        .score-text {
            font-size: 16px;
            color: #8b8b8b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #score {
            font-size: 56px;
            font-weight: 800;
            margin: 5px 0;
            font-family: sans-serif;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Oltin Tanga */
        .coin-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .coin {
            width: 300px;
            height: 300px;
            background: url('https://cdn3d.iconscout.com/3d/premium/thumb/gold-coin-5600938-4672689.png') no-repeat center;
            background-size: contain;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.05s ease;
            box-shadow: 0 0 80px rgba(255, 165, 0, 0.2);
            z-index: 20;
        }

        .coin:active {
            transform: scale(0.92); /* Bosganda kichrayish effekti */
        }

        /* Bosganda chiqadigan +1 */
        .float-text {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 32px;
            animation: floatUp 0.8s ease-out forwards;
            pointer-events: none;
            z-index: 30;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
        }

        /* Pastki menyu va Energiya */
        .bottom-menu {
            width: 90%;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .energy-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .energy-icon {
            width: 24px;
            height: 24px;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 5px;
            background: #e3a009;
            width: 100%; /* JS bilan o'zgaradi */
            border-radius: 0 0 20px 20px;
            opacity: 0.5;
        }

    </style>
</head>
<body>

    <div class="score-container">
        <div class="score-text">Sizning hisobingiz</div>
        <div id="score">0</div>
    </div>

    <div class="coin-container">
        <div class="coin" id="coinBtn"></div>
    </div>

    <div class="bottom-menu">
        <div class="energy-info">
            <span>⚡</span>
            <span id="energyText">1000</span>
            <span style="color: #666; font-size: 14px;">/ 1000</span>
        </div>
        <div class="progress-bar" id="energyBar"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // To'liq ekran

        // XOTIRA (LocalStorage) - Pulingiz o'chib ketmaydi!
        let score = localStorage.getItem('fruzi_score') ? parseInt(localStorage.getItem('fruzi_score')) : 0;
        let energy = 1000;
        
        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energyText');
        const energyBar = document.getElementById('energyBar');
        const coinBtn = document.getElementById('coinBtn');

        // Boshlanishida eski hisobni ko'rsatish
        scoreEl.innerText = score.toLocaleString();

        // Tanga bosilganda
        coinBtn.addEventListener('click', (e) => {
            // Bir vaqtning o'zida bir nechta barmoq bilan bosishni hisobga olish
            handleTap(e.clientX, e.clientY);
        });

        // Ekranni bosganda (Multi-touch uchun)
        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Ekranni yaqinlashtirishni bloklash
            for (let i = 0; i < e.touches.length; i++) {
                handleTap(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, {passive: false});

        function handleTap(x, y) {
            if (energy > 0) {
                // Ball qo'shish
                score++;
                energy--;
                
                // XOTIRAGA YOZISH (Eng muhimi shu)
                localStorage.setItem('fruzi_score', score);

                updateDisplay();
                
                // Vibratsiya
                tg.HapticFeedback.impactOccurred('light');

                // +1 rasmi uchib chiqishi
                showFloatText(x, y);
            }
        }

        function updateDisplay() {
            scoreEl.innerText = score.toLocaleString();
            energyEl.innerText = energy;
            // Energiyani foizda hisoblash
            let percentage = (energy / 1000) * 100;
            energyBar.style.width = percentage + '%';
        }

        function showFloatText(x, y) {
            const text = document.createElement('div');
            text.className = 'float-text';
            text.innerText = '+1'; // Bu yerga +5 yoki +10 qilsa ham bo'ladi
            
            // Tasodifiy ozgina o'ngga yoki chapga chiqishi uchun
            let randomX = (Math.random() - 0.5) * 40;
            
            text.style.left = (x + randomX) + 'px';
            text.style.top = (y - 50) + 'px';
            document.body.appendChild(text);

            setTimeout(() => { text.remove(); }, 800);
        }

        // Energiyani tiklash (har soniyada +3)
        setInterval(() => {
            if (energy < 1000) {
                energy += 3;
                if(energy > 1000) energy = 1000;
                updateDisplay();
            }
        }, 1000);

    </script>
</body>
</html>
